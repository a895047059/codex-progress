<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务进度</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/composer.css"><link rel="stylesheet" href="/recording.css"><link rel="stylesheet" href="/status-inquiry.css"><link rel="stylesheet" href="/token-chart.css"></head>
<body>
<main>
  <header><span class="app-name"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>任务进度</span><span id="connection" role="status">正在连接</span></header>
  <section class="task-switcher" aria-label="任务切换">
    <div class="task-toolbar"><label id="thread-count" for="threads">任务 0</label><button id="follow" type="button" title="跟随最新启动的任务" aria-pressed="true">自动跟随</button></div>
    <div class="task-picker"><button id="threads" type="button" aria-label="选择任务" aria-haspopup="dialog" aria-expanded="false" aria-controls="task-picker-menu">等待任务开始</button><div id="task-picker-menu" class="picker-menu" role="dialog" aria-label="选择任务" hidden></div></div>
  </section>
  <section id="thread-panel" aria-label="当前任务详情">
  <div class="map-head"><span id="map-label">任务分布</span><span class="map-controls"><button id="grid-more" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="all-tasks-dialog" hidden>更多任务</button><span id="state-label">等待开始</span></span></div>
    <section class="map-area" aria-label="子任务进度"><div id="grid" role="group" aria-label="任务格子"><div id="grid-frames" aria-hidden="true"></div><div id="grid-cells"></div></div></section>
    <div class="legend" aria-label="颜色说明"><span><i class="completed"></i>已完成</span><span><i class="in_progress"></i>进行中</span><span><i class="pending"></i>待开始</span><span id="issue-legend" hidden><i class="failed"></i>异常</span></div>
    <section id="token-chart" aria-label="Token 用量与平均速率"></section>
    <section class="summary" aria-label="总体目标和当前进度">
      <div class="goal-column"><div class="goal-heading"><h1>总体目标</h1><div class="goal-actions"><span id="goal-status"></span><button id="goal-toggle" type="button" aria-label="继续目标" title="继续目标" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="4"/><g data-goal-play><path class="goal-icon-mark" d="M10 8.5v7l6-3.5z"/></g><g data-goal-pause hidden><rect class="goal-icon-mark" x="8.5" y="8" width="2.5" height="8" rx=".7"/><rect class="goal-icon-mark" x="13" y="8" width="2.5" height="8" rx=".7"/></g></svg></button><button id="status-inquiry-toggle" type="button" aria-label="询问任务状态" title="询问任务状态" aria-haspopup="dialog" aria-controls="status-inquiry-dialog" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 19H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-6l-5 3z"/><path d="M9.5 8a2.5 2.5 0 0 1 5 .5c0 1.7-2.5 1.8-2.5 3.5"/><circle cx="12" cy="15.5" r=".8" fill="currentColor" stroke="none"/></svg></button><button id="subagent-toggle" class="icon-button" type="button" aria-label="查看子代理" title="查看子代理" aria-haspopup="dialog" aria-controls="subagent-dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></button></div></div><p id="goal">等待下一项任务</p></div>
      <div class="progress-column"><h2>当前进度</h2><p class="count"><strong id="done">0</strong><span> / </span><span id="total">0</span><span class="unit"> 项</span></p><p id="current">尚未开始</p><div class="track" role="progressbar" aria-label="任务完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div></div>
    </section>
    <div class="desc-row"><span>当前输入</span><button id="desc" type="button" aria-haspopup="dialog">尚无输入</button></div>
    <div class="continue-row"><button id="composer-toggle" type="button" aria-label="展开输入框" title="展开输入框" aria-expanded="false" aria-controls="composer" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M6.5 9.5h4.5M6.5 14h3"/><path d="M14 9h4M16 9v6M14 15h4"/></svg></button></div>
    <section id="control-requests" aria-label="需要你的确认" hidden></section>
    <section id="composer" aria-label="任务输入" hidden>
      <div class="compose-box">
        <div id="compose-attachments" aria-label="已添加的附件"></div>
        <textarea id="compose-text" rows="3" placeholder="继续这个任务…" aria-label="发送给当前任务的内容"></textarea>
        <div class="compose-tools">
          <button id="compose-add" type="button" aria-label="添加" aria-haspopup="menu" aria-expanded="false">＋</button>
          <select id="compose-permission" aria-label="访问权限"><option value="">沿用会话权限</option><option value="read">只读</option><option value="workspace">工作区访问</option><option value="full">完全访问</option></select>
          <span id="compose-plan-badge" hidden>计划</span><span class="compose-spacer"></span>
          <button id="compose-model" type="button" aria-haspopup="dialog" aria-expanded="false">沿用模型⌄</button>
          <button id="compose-send" type="button" aria-label="发送" disabled>↑</button>
          <button id="compose-stop" type="button" aria-label="停止当前执行" hidden>■</button>
        </div>
        <div id="compose-menu" role="menu" aria-label="添加" hidden></div>
        <div id="compose-model-menu" role="dialog" aria-label="选择模型和思考程度" hidden></div>
      </div>
      <p id="compose-feedback" role="status"></p>
      <input id="compose-files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
    </section>
    <footer><span id="elapsed">—</span><span id="control-hint"></span><span id="footnote">每格是一项任务</span></footer>
  </section>
</main>
<dialog id="input-history" role="dialog" aria-modal="true" aria-labelledby="history-title"><div class="history-header"><strong id="history-title">输入记录</strong><button id="history-close" type="button" aria-label="关闭输入记录">×</button></div><p id="history-empty"></p><ol id="history-list"></ol></dialog>
<dialog id="goal-editor" role="dialog" aria-modal="true" aria-labelledby="goal-editor-title"><form method="dialog"><div class="history-header"><strong id="goal-editor-title">总体目标</strong><button value="cancel" aria-label="关闭目标设置">×</button></div><textarea id="goal-objective" rows="4" aria-label="持续追求的目标" placeholder="希望 Codex 持续完成什么？"></textarea><p id="goal-editor-error" role="status"></p><div class="dialog-actions"><button value="cancel">取消</button><button id="goal-save" type="button">开始追求目标</button></div></form></dialog>
<dialog id="drawing-dialog" role="dialog" aria-modal="true" aria-labelledby="drawing-title"><div class="history-header"><strong id="drawing-title">绘制草图</strong><button id="drawing-close" aria-label="关闭草图">×</button></div><canvas id="drawing-canvas" width="1000" height="560" aria-label="草图画布"></canvas><div class="drawing-tools"><label>颜色 <input id="drawing-color" type="color" value="#202427"></label><label>笔宽 <input id="drawing-width" type="range" min="1" max="15" value="3"></label><button id="drawing-undo">撤销</button><button id="drawing-clear">清空</button><button id="drawing-attach">添加草图</button></div></dialog>
<dialog id="status-inquiry-dialog" role="dialog" aria-modal="true" aria-labelledby="status-inquiry-title" aria-describedby="status-inquiry-notice">
  <div class="status-inquiry-shell">
    <header class="status-inquiry-header"><div><div class="status-inquiry-title-row"><strong id="status-inquiry-title">询问任务状态</strong><span class="status-inquiry-badge">状态问询 · 仅查日志</span></div><div class="status-inquiry-target"><span>正在询问</span><strong id="status-inquiry-target">等待选择任务</strong></div></div><button id="status-inquiry-close" type="button" aria-label="关闭状态问询">×</button></header>
    <p id="status-inquiry-notice" class="status-inquiry-notice">此问答只读取任务日志，不会向原任务发送消息。</p>
    <div id="status-inquiry-messages" class="status-inquiry-messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="状态问询对话"></div>
    <div class="status-inquiry-state"><span id="status-inquiry-state-text" role="status"></span><button id="status-inquiry-retry" type="button" hidden>重试</button></div>
    <form id="status-inquiry-form" class="status-inquiry-form">
      <label class="visually-hidden" for="status-inquiry-question">询问当前任务状态</label>
      <textarea id="status-inquiry-question" rows="2" maxlength="4000" placeholder="询问当前任务的进度或阻塞情况" disabled></textarea>
      <div class="status-inquiry-tools"><span id="status-inquiry-count">0 / 4000</span><button id="status-inquiry-send" type="submit" disabled>发送</button></div>
    </form>
  </div>
</dialog>
<dialog id="subagent-dialog" class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="subagent-title">
  <div class="detail-shell">
    <header class="detail-header"><div><strong id="subagent-title">子代理</strong><span id="subagent-count"></span></div><button id="subagent-close" type="button" aria-label="关闭子代理详情">×</button></header>
    <p id="subagent-message" class="detail-message" role="status">正在加载子代理…</p>
    <div class="subagent-layout"><div id="subagent-list" class="subagent-list" aria-label="子代理列表"></div><section id="subagent-detail" class="subagent-detail" aria-label="子代理详情" hidden><div class="subagent-detail-heading"><strong id="subagent-detail-title"></strong><span id="subagent-detail-status"></span></div><p id="subagent-detail-times" class="subagent-detail-times"></p><p id="subagent-output-message" class="detail-message" role="status"></p><div id="subagent-outputs" class="subagent-outputs"></div></section></div>
  </div>
</dialog>
<dialog id="all-tasks-dialog" class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="all-tasks-title">
  <div class="detail-shell"><header class="detail-header"><strong id="all-tasks-title">全部任务</strong><button id="all-tasks-close" type="button" aria-label="关闭全部任务">×</button></header><div id="all-task-groups" class="all-task-groups"></div></div>
</dialog>
<div id="tooltip" role="tooltip" hidden><span id="tip-index"></span><strong id="tip-title"></strong><p id="tip-detail"></p></div>
<script src="/task-picker.js"></script><script src="/input-history.js"></script><script src="/approvals.js"></script><script src="/drawing.js"></script><script src="/editor-context.js"></script><script src="/recording.js"></script><script src="/composer.js"></script><script src="/status-inquiry.js"></script><script src="/token-trend.js"></script><script src="/token-chart.js"></script><script src="/app.js"></script>
</body></html>
